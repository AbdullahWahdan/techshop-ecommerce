server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global Cross-Origin Resource Sharing (CORS) Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Dynamic Microservice Route Rules
      routes:
        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/v1/products/**

        - id: inventory-service
          uri: http://${INVENTORY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/v1/inventory/**

        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/orders/**

        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/v1/users/**

        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always