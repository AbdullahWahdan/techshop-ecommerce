name: TechShop Enterprise Multi-Stage CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # STAGE 1: Build & Unit / Integration Test Stage
  # =========================================================================
  build-and-test:
    name: "Stage 1: Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend Microservices
        run: |
          cd backend
          mvn clean test -DfailIfNoTests=false

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Verify Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  # =========================================================================
  # STAGE 2: Security & Vulnerability Scanning Stage (Trivy)
  # =========================================================================
  security-scan:
    name: "Stage 2: Vulnerability Scan"
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pre-populate Local Maven Cache for Offline Trivy Resolution
        run: |
          cd backend
          mvn dependency:go-offline -DfailIfNoTests=false || true

      - name: Security Vulnerability Scan (Trivy FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'vuln'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # STAGE 3: Multi-Stage Docker Build Stage
  # =========================================================================
  docker-build:
    name: "Stage 3: Docker Build & Containerize"
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Product Service Image
        run: |
          docker build -t techshop/product-service:latest -f backend/product-service/Dockerfile backend

      - name: Build API Gateway Image
        run: |
          docker build -t techshop/api-gateway:latest -f backend/api-gateway/Dockerfile backend

      - name: Build Frontend React Image
        run: |
          docker build -t techshop/frontend:latest -f frontend/Dockerfile frontend

  # =========================================================================
  # STAGE 4: Kubernetes Deployment Validation Stage
  # =========================================================================
  deploy-k8s:
    name: "Stage 4: Kubernetes Manifest Validation"
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes Cluster (Kind)
        uses: helm/kind-action@v1.10.0

      - name: Validate Kubernetes Manifest Syntax
        run: |
          kubectl apply --dry-run=client -f k8s/techshop-deployments.yaml